<!doctype html>
<html lang="es-MX" data-tema="sistema">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NOMBREAPP · Encuentra tu camino</title>
    <meta
      name="description"
      content="Explora carreras y descubre qué se te acomoda. Funciona sin internet."
    />
    <meta name="theme-color" content="#1d4ed8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NOMBREAPP" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./iconos/icono-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./iconos/icono-192.png" />
    <!-- tema aplicado antes de pintar: evita el parpadeo blanco en modo oscuro -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('nombreapp:v1:tema');
          if (t) document.documentElement.dataset.tema = JSON.parse(t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <noscript>
      <p style="padding: 24px; font: 16px/1.6 system-ui">
        Necesitas activar JavaScript en tu navegador para usar NOMBREAPP.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
